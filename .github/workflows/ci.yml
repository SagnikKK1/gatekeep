name: ci
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - run: scripts/e2e.sh
        if: runner.os != 'Windows'
      - name: dist/ is current
        run: |
          npm run build --silent
          git diff --exit-code -- 'dist/src' || {
            echo 'dist/src is stale: run `npm run build` and commit the result.' >&2
            exit 1
          }
  # Pushing to main is the release. npm used to be a separate manual step, and the published package drifted 57
  # commits behind this branch: `gatekeep install` from npm could not do two of the things the README described.
  # Order matters — the version bump is committed and pushed *before* `npm publish`, so a rejected push aborts the
  # release rather than leaving npm ahead of the repository. If publishing fails after that, main simply carries a
  # version the registry does not have yet, and the next push publishes it.
  release:
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write        # the OIDC token npm trusted publishing authenticates with
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1; Node 22 still bundles npm 10, so npm is upgraded
      # explicitly. The test matrix stays on 20 and 22, because that is what users actually run gatekeep on.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm ci

      # Only what npm actually serves counts: the `files` list in package.json plus the sources it is built from.
      # A change under docs/ or test/ is not a new release.
      - name: Does this push change what npm serves?
        id: scope
        run: |
          before='${{ github.event.before }}'
          if [ -z "$before" ] || [ "$before" = '0000000000000000000000000000000000000000' ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo 'no usable "before" commit; treating this as a release'
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$before" '${{ github.sha }}' -- src package.json action.yml scripts/annotate.mjs README.md LICENSE; then
            echo 'only unpackaged files changed; nothing to publish'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Pick the version
        id: v
        if: steps.scope.outputs.publish == 'true'
        run: echo "version=$(node dist/src/release.js next)" >> "$GITHUB_OUTPUT"

      - name: Commit the version, in all four places that have to agree
        if: steps.scope.outputs.publish == 'true'
        run: |
          v='${{ steps.v.outputs.version }}'
          npm version "$v" --no-git-tag-version --allow-same-version >/dev/null
          node dist/src/release.js set "$v"
          npm run build --silent
          npm test --silent          # the manifest test is what proves the four agree
          git config user.name  'Sagnik Dey'
          git config user.email 'sagnik1.dey.official@gmail.com'
          git add package.json package-lock.json .claude-plugin hooks/gatekeep-hook.sh dist/src
          git diff --cached --quiet || git commit -m "Release $v"
          # Someone may have pushed while the matrix ran. The version commit touches only version fields, so
          # replaying it on top is safe, and a bare push would abort the release over an unrelated commit.
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish
        if: steps.scope.outputs.publish == 'true'
        run: npm publish --provenance --access public

      # `v1` is what `uses: SagnikKK1/gatekeep@v1` resolves to, so it has to move with every release or the Action
      # goes stale on its own — which is what happened: it sat 22 commits back while npm sat 57 back.
      - name: Tag
        if: steps.scope.outputs.publish == 'true'
        run: |
          v='${{ steps.v.outputs.version }}'
          git tag -a "v$v" -m "v$v"
          git tag -f v1
          git push origin "v$v"
          git push -f origin v1

  self-gate:
    # gatekeep guarding its own pull requests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./
        with:
          base: ${{ github.event.pull_request.base.sha }}
