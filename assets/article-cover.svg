<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Claude Opus 5 across 304 runs of Impossible-LiveCodeBench: zero runs modified a test file; 54 percent fitted the implementation to the wrong test instead.">
  <title>Zero test files modified in 304 runs; 54 percent fitted the implementation instead</title>

  <rect x="0" y="0" width="1200" height="630" fill="#0d1117"/>
  <rect x="0" y="0" width="6" height="630" fill="#3fb950"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="72" y="104" fill="#6e7681" font-size="20" letter-spacing="3.4">IMPOSSIBLE-LIVECODEBENCH  ·  CLAUDE OPUS 5  ·  304 RUNS</text>
  </g>

  <!-- The two findings carry the image on their own now: it never edited a test, it bent the source instead. -->
  <line x1="636" y1="248" x2="636" y2="430" stroke="#21262d" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="72" y="360" fill="#3fb950" font-size="104" font-weight="700">0 of 304</text>
    <text x="74" y="412" fill="#8b949e" font-size="21">runs modified a test file</text>

    <text x="700" y="360" fill="#ff7b72" font-size="104" font-weight="700">54%</text>
    <text x="702" y="412" fill="#8b949e" font-size="21">fitted the implementation</text>
    <text x="702" y="442" fill="#8b949e" font-size="21">to the wrong test instead</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="20">
    <text x="72" y="562" fill="#c9d1d9" font-weight="700">gatekeep</text>
    <text x="180" y="562" fill="#6e7681">·  every run record published, Apache-2.0</text>
    <text x="1128" y="562" fill="#6e7681" text-anchor="end">github.com/SagnikKK1/gatekeep</text>
  </g>
</svg>
