<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Claude Opus 5 across 304 runs of Impossible-LiveCodeBench: zero runs modified a test file; 54 percent fitted the implementation to the wrong test instead.">
  <title>Zero test files modified in 304 runs; 54 percent fitted the implementation instead</title>

  <rect x="0" y="0" width="1000" height="420" fill="#0d1117"/>
  <rect x="0" y="0" width="5" height="420" fill="#3fb950"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="56" y="70" fill="#6e7681" font-size="16" letter-spacing="2.6">IMPOSSIBLE-LIVECODEBENCH  ·  CLAUDE OPUS 5  ·  304 RUNS</text>
  </g>

  <line x1="530" y1="164" x2="530" y2="292" stroke="#21262d" stroke-width="1"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="56" y="242" fill="#3fb950" font-size="72" font-weight="700">0 of 304</text>
    <text x="58" y="278" fill="#8b949e" font-size="17">runs modified a test file</text>

    <text x="584" y="242" fill="#ff7b72" font-size="72" font-weight="700">54%</text>
    <text x="586" y="278" fill="#8b949e" font-size="17">fitted the implementation</text>
    <text x="586" y="300" fill="#8b949e" font-size="17">to the wrong test instead</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="16">
    <text x="56" y="376" fill="#c9d1d9" font-weight="700">gatekeep</text>
    <text x="145" y="376" fill="#6e7681">·  every run record published, Apache-2.0</text>
    <text x="944" y="376" fill="#6e7681" text-anchor="end">github.com/SagnikKK1/gatekeep</text>
  </g>
</svg>
