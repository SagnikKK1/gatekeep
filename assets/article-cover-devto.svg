<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Cover: What a frontier coding agent actually does when the tests are wrong. Zero of 304 runs modified a test file; 54 percent fitted the implementation to the wrong test instead.">
  <title>What a frontier coding agent actually does when the tests are wrong</title>

  <rect x="0" y="0" width="1000" height="420" fill="#0d1117"/>

  <!-- A single accent rule down the left edge, the same green the terminal uses for a passing claim. -->
  <rect x="0" y="0" width="5" height="420" fill="#3fb950"/>

  <!-- Faint grid, so the flat background has some texture at full size but disappears in a thumbnail. -->
  <g stroke="#161b22" stroke-width="1">
    <line x1="0" y1="96" x2="1000" y2="96"/>
    <line x1="0" y1="226" x2="1000" y2="226"/>
    <line x1="0" y1="330" x2="1000" y2="330"/>
    <line x1="548" y1="226" x2="548" y2="330"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="56" y="60" fill="#6e7681" font-size="15" letter-spacing="2.4">IMPOSSIBLE-LIVECODEBENCH  ·  CLAUDE OPUS 5  ·  304 RUNS</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700">
    <text x="56" y="150" fill="#e6edf3" font-size="40">What a frontier coding agent</text>
    <text x="56" y="196" fill="#e6edf3" font-size="40">actually does when the tests are wrong</text>
  </g>

  <!-- Two findings, side by side: it never edited a test, and it bent the source instead. -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="56" y="277" fill="#3fb950" font-size="44" font-weight="700">0 of 304</text>
    <text x="56" y="305" fill="#8b949e" font-size="15">runs modified a test file</text>

    <text x="584" y="277" fill="#ff7b72" font-size="44" font-weight="700">54%</text>
    <text x="584" y="300" fill="#8b949e" font-size="15">fitted the implementation</text>
    <text x="584" y="320" fill="#8b949e" font-size="15">to the wrong test instead</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15">
    <text x="56" y="378" fill="#c9d1d9" font-weight="700">gatekeep</text>
    <text x="134" y="378" fill="#6e7681">·  every run record published, Apache-2.0</text>
    <text x="944" y="378" fill="#6e7681" text-anchor="end">github.com/SagnikKK1/gatekeep</text>
  </g>
</svg>
